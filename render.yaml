databases:
  - name: smartexam-db
    plan: free
    databaseName: smartexam_db
    user: smartexam_user

services:
  - type: web
    name: smartexam-backend
    runtime: docker
    dockerfilePath: ./platform/Dockerfile
    dockerContext: ./platform
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: smartexam-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: smartexam-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: smartexam-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: smartexam-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: smartexam-db
          property: password
      - key: AI_SERVICE_URL
        fromService:
          name: smartexam-ai
          type: web
          property: host
      - key: JWT_SECRET
        generateValue: true

  - type: web
    name: smartexam-ai
    runtime: docker
    dockerfilePath: ./ai-service/Dockerfile
    dockerContext: ./ai-service
    plan: free
    envVars:
      - key: GEMINI_API_KEY
        sync: false
