# Uygulama
spring.application.name=smart-exam-platform
server.port=${PORT:8080}

# PostgreSQL Bağlantısı
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:smartexam_db}
spring.datasource.username=${DB_USERNAME:smartexam_user}
spring.datasource.password=${DB_PASSWORD:smartexam123}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# AI Servisi
ai.service.url=${AI_SERVICE_URL:http://localhost:5000}

# Loglama
logging.level.org.springframework.security=DEBUG