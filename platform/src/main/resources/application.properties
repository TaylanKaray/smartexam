# Uygulama
spring.application.name=smart-exam-platform
server.port=${PORT:8080}

# PostgreSQL Bağlantısı
spring.datasource.url=${JDBC_DATABASE_URL:${DATABASE_URL:jdbc:postgresql://localhost:5432/smartexam_db}}
spring.datasource.username=${DB_USERNAME:smartexam_user}
spring.datasource.password=${DB_PASSWORD:smartexam123}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Loglama
logging.level.org.springframework.security=DEBUG